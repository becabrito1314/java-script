<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <style>
        body{
            text-align: center;
            background-color: dimgrey;
            font-size: 20px;
            padding: 20px;
        }

        main{
            background-color: whitesmoke;
            width: 500px;
            height: 500px;
            border-radius: 10px;
            box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.397);
            margin: auto;
        }

        input{
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Calcule seu IMC</h1>
        <input type="number" name="peso" id="peso" placeholder="Digite seu Peso ">
        <br><br>
        <input type="number" name="altura" id="altura" placeholder="Digite sua altura">
        <br><br>
        <input type="button" value="Verificar" onclick="Calcular()">
        <br>
        <div id="res"></div>
        <br>
    </main>

    <script>
        function Calcular(){
            const peso = parseFloat(document.getElementById("peso").value)
            const altura = parseFloat(document.getElementById("altura").value)
            const res = document.getElementById("res")
            const imc = peso / (altura * altura)
            let classificacao = ""

            if(imc < 18.5){
                classificacao = "Abaixo do peso"
            } else if(imc < 25){
                classificacao = "Peso normal"
            } else if(imc < 30){
                classificacao = "Acima do peso"
            } else if(imc < 35){
                classificacao = "Obesidade grau 1"
            } else if(imc < 40){
                classificacao = "Obesidade grau 2"
            } else {
                classificacao = "Obesidade grau 3"
            }

            res.textContent = `Seu IMC é de ${imc.toFixed(2)} - ${classificacao}`

        }
    </script>
</body>
</html>
